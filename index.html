  <title>
   85&deg;C 超長蛋塔 60CM - 10元客服預購
  </title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700;900&amp;display=swap" rel="stylesheet"/>
  <style>
   *{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans TC',sans-serif;}
body{background:#FFF6D6;}
.wrap{max-width:420px;margin:0 auto;background:#FFF6D6;min-height:100vh;position:relative;}
.hero-wrap{position:relative;background:#1a0f08;}
.hero-wrap img{width:100%;display:block;}
.hero-wrap::after{content:"";position:absolute;left:0;right:0;bottom:0;height:130px;background:linear-gradient(to bottom, transparent 0%, #FFF6D6 92%);}
.top-pill{position:absolute;top:14px;left:14px;background:linear-gradient(135deg,#FF2D55,#E91E63);color:white;padding:6px 14px;border-radius:100px;font-size:12px;font-weight:700;z-index:2;}
.card{margin:-46px 16px 0 16px;background:white;border-radius:24px;padding:18px;box-shadow:0 12px 40px rgba(62,39,35,.12);position:relative;z-index:3;}
.title{font-size:20px;font-weight:900;}
.sub{font-size:13px;color:#8D6E63;}
.tags{display:flex;gap:6px;margin-top:10px;}
.tag{font-size:11px;padding:5px 10px;border-radius:100px;background:#2B1A12;color:#FFE082;font-weight:700;}
.tag.light{background:#FFF3E0;color:#5D4037;}
.orig{text-decoration:line-through;color:#B0BEC5;font-size:14px;}
.now{font-size:36px;font-weight:900;color:#C62828;}
.form{margin:14px 16px;background:white;border-radius:20px;padding:16px;box-shadow:0 4px 20px rgba(0,0,0,.06);}
.label{font-size:12px;font-weight:700;color:#5D4037;margin-bottom:6px;display:block;}
.select,.input{width:100%;padding:11px 12px;border:1.5px solid #EFEBE9;border-radius:12px;background:#FAFAFA;font-size:13px;}
.bar{position:sticky;bottom:0;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-top:1px solid #EFEBE9;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;}
.cta{background:#2B1A12;color:#FFD54F;border:none;padding:12px 22px;border-radius:100px;font-weight:900;cursor:pointer;}
.qty-row{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}
.qty-ctrl{display:flex;gap:10px;align-items:center;}
.qty-btn{width:36px;height:36px;border-radius:10px;border:1.5px solid #EFEBE9;background:white;font-size:18px;cursor:pointer;}
.modal{position:fixed;inset:0;background:rgba(30,15,5,.6);backdrop-filter:blur(6px);display:none;align-items:center;justify-content:center;z-index:99;padding:20px;}
.modal-card{background:white;border-radius:24px;padding:24px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.2);}
.kf-btn{background:#2B1A12;color:#FFD93D;width:100%;padding:14px;border-radius:100px;border:none;font-weight:900;font-size:15px;margin-top:14px;cursor:pointer;}
  </style>
